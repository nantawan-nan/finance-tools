name: db-migrate

on:
  push:
    paths:
      - 'supabase/**.sql'
  workflow_dispatch:

jobs:
  migrate:
    name: Run SQL Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run all SQL files via Supabase Management API
        env:
          SUPA_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPA_PROJECT_REF: qbsuynmsjieqglxzbqpw
        run: |
          SQL_FILES=$(ls supabase/*.sql 2>/dev/null | sort)
          if [ -z "$SQL_FILES" ]; then
            echo "ไม่พบไฟล์ .sql"
            exit 0
          fi

          # ★ H7: รัน 2 รอบ — ไฟล์ทุกตัว idempotent → รอบแรก best-effort (ข้าม error ลำดับ
          #   dependency บน fresh clone เช่น ar-module/bankrec อ้าง companies/bank_accounts
          #   ที่ phase0/finops สร้างทีหลังในรอบเดียวกัน) · รอบสอง strict (dependency ครบแล้ว
          #   ทุกไฟล์ต้องผ่าน + รายงาน error จริง) → clone จบใน push เดียว · CI ไม่แดงหลอก
          run_pass() {   # $1=label  $2=strict(true→fail+annotate)
            local ok=true
            for FILE in $SQL_FILES; do
              echo "▶ [$1] $FILE"
              PAYLOAD=$(jq -n --rawfile query "$FILE" '{"query": $query}')
              RESPONSE=$(curl -s -o /tmp/res.json -w "%{http_code}" \
                -X POST \
                -H "Authorization: Bearer $SUPA_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "https://api.supabase.com/v1/projects/$SUPA_PROJECT_REF/database/query")
              if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "201" ]; then
                echo "✅ $FILE — สำเร็จ"
              else
                ERRMSG=$(jq -r '.message // .error // .' /tmp/res.json 2>/dev/null | tr '\n' ' ' | head -c 300)
                echo "❌ $FILE — ล้มเหลว (HTTP $RESPONSE): $ERRMSG"
                if [ "$2" = "true" ]; then
                  echo "::error title=migrate $FILE::HTTP $RESPONSE — $ERRMSG"
                  ok=false
                fi
              fi
            done
            [ "$ok" = "true" ]
          }

          echo "═══ รอบที่ 1 (best-effort · ข้าม dependency-order error) ═══"
          run_pass "pass1" false || true
          echo "═══ รอบที่ 2 (strict · ทุกไฟล์ต้องผ่าน) ═══"
          if run_pass "pass2" true; then
            echo "✅ Migration ทั้งหมดสำเร็จ"
          else
            echo "❌ มีบาง migration ล้มเหลว (หลังรอบ 2 = error จริง ไม่ใช่แค่ลำดับ)"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          FILES=$(ls supabase/*.sql 2>/dev/null | wc -l)
          echo "### Migration Result" >> $GITHUB_STEP_SUMMARY
          echo "- **SQL files:** $FILES ไฟล์" >> $GITHUB_STEP_SUMMARY
          echo "- **เวลา:** $(TZ='Asia/Bangkok' date '+%d/%m/%Y %H:%M ICT')" >> $GITHUB_STEP_SUMMARY
